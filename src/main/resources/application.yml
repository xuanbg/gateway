spring:
  application:
    name: common-gateway
  main:
    web-application-type: reactive
  cloud:
    consul:
      config:
        defaultContext: ${spring.application.name}
        format: yaml
        prefixes: config
---
spring:
  cloud:
    consul:
      host: localhost
  config:
    activate:
      on-profile: pro
    import: optional:consul:localhost:8500
---
spring:
  cloud:
    consul:
      host: 192.168.1.94
  config:
    activate:
      on-profile: test
    import: optional:consul:192.168.1.94:8500
---
spring:
  cloud:
    consul:
      host: 192.168.39.147
  config:
    activate:
      on-profile: dev
    import: optional:consul:192.168.39.147:8500
